<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Arms of Time</title>
    <meta
      name="description"
      content="Deep time laid out across your outstretched arms: fingertip to fingertip, the Big Bang to now, in years and in generations."
    />
    <!-- The card a chat app or a social site draws when the link is shared.
         Only those sites fetch og.png; the page itself never does. The URLs
         have to be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thearmsoftime.github.io/" />
    <meta property="og:title" content="The Arms of Time" />
    <meta
      property="og:description"
      content="The history of the universe, laid along your outstretched arms."
    />
    <meta property="og:image" content="https://thearmsoftime.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Leonardo's Vitruvian Man with a timeline along his arms, from the Big Bang to now"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A6%BE%3C/text%3E%3C/svg%3E" />
    <script>
      // Settle the theme before the first paint, so there is no flash. Anything
      // but an explicit dark/light choice follows the browser, which is also
      // the default. Keep the key in step with src/theme.ts.
      try {
        var t = localStorage.getItem('armsoftime:theme')
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
