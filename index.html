<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Arms of Time</title>
    <meta
      name="description"
      content="Deep time laid out across your outstretched arms: fingertip to fingertip, the Big Bang to now, in years and in generations."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A6%BE%3C/text%3E%3C/svg%3E" />
    <script>
      // Set the remembered theme before the first paint, so there is no flash.
      // Keep the key in step with src/theme.ts.
      try {
        var t = localStorage.getItem('armsoftime:theme')
        if (t === 'black' || t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
